name: Build BitAnime Pro v23.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - index.html
      - manifest.json
      - package.json
      - capacitor.config.json
      - scripts/**
      - assets/**
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare Capacitor Android project
        run: |
          test -f index.html || { echo "index.html missing"; exit 1; }
          mkdir -p www
          cp index.html www/index.html
          [ ! -f manifest.json ] || cp manifest.json www/manifest.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install -D @capacitor/assets@3
          npx cap add android
          npx cap copy android
      - name: Generate Android app assets
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#050608' --splashBackgroundColor '#050608' || true
      - name: Apply BitAnime Android patches
        run: python3 scripts/patch_android.py
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apks/BitAnime-Pro-v23.0-Debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BitAnime-Pro-v23.0-APK
          path: dist-apks/*.apk
