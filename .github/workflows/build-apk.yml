name: Build BitAnime Pro v23.0 Premium APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/source_chunks/**'
      - '.github/patches/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore exact v23.0 project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/source_chunks/*.b64 > /tmp/bitanime-v23.0.zip.b64
          base64 --decode /tmp/bitanime-v23.0.zip.b64 > /tmp/bitanime-v23.0.zip
          unzip -t /tmp/bitanime-v23.0.zip
          unzip -oq /tmp/bitanime-v23.0.zip -d .
          test -s index.html
          test -s package.json
          test -s capacitor.config.json
          test -s scripts/patch_android.py
          test -s signing/bitanime-release.keystore
          node -e "if (require('./package.json').version !== '23.0.0') process.exit(1)"
          echo "Restored BitAnime Pro v23.0.0 source successfully"

      - name: Apply premium full-bleed mobile hero refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path
          page = Path("index.html")
          source = page.read_text(encoding="utf-8")
          css = Path(".github/patches/premium-cinema.css").read_text(encoding="utf-8")
          marker = 'id="bitanime-premium-cinema-v23-refresh"'
          if marker in source:
              raise SystemExit("Premium cinema CSS is already injected")
          if "</head>" not in source:
              raise SystemExit("HTML head closing tag not found")
          style = '<style id="bitanime-premium-cinema-v23-refresh">\n' + css + '\n</style>\n'
          page.write_text(source.replace("</head>", style + "</head>", 1), encoding="utf-8")
          print("Premium cinematic hero CSS injected")
          PYEOF

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 35 and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Prepare Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then cp manifest.json www/manifest.json; fi
          if [ -f assets/icon-512.png ]; then cp assets/icon-512.png www/icon.png; fi
          npm install
          npx cap add android
          npx cap copy android

      - name: Generate app icons and splash screens
        shell: bash
        run: |
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#050608' --splashBackgroundColor '#050608'
          fi

      - name: Apply BitAnime Android patches
        run: python3 scripts/patch_android.py

      - name: Set Android v23.0 version metadata
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          path = Path("android/app/build.gradle")
          content = path.read_text(encoding="utf-8")
          content, code_count = re.subn(r"versionCode\s+\d+", "versionCode 23000", content, count=1)
          content, name_count = re.subn(r"""versionName\s+["'][^"']+["']""", 'versionName "23.0"', content, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not set Android versionCode/versionName")
          path.write_text(content, encoding="utf-8")
          print("Android version set to 23.0 (versionCode 23000)")
          PYEOF

      - name: Configure regional Maven fallback
        shell: bash
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          mirror = 'maven { url "https://maven-central-asia.storage-download.googleapis.com/maven2/" }'
          for path in Path("android").rglob("*.gradle"):
              source = path.read_text(encoding="utf-8")
              if "mavenCentral()" in source and mirror not in source:
                  path.write_text(source.replace("mavenCentral()", mirror + "\n        mavenCentral()"), encoding="utf-8")
          PYEOF

      - name: Build and sign installable Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_PATH="signing/bitanime-release.keystore"
          test -s "$KS_PATH"

          # Use Actions secrets when present; otherwise read the owner's bundled signing information.
          KS_PASS="${KEYSTORE_PASSWORD:-$(grep -m1 'KEYSTORE_PASSWORD =' signing/SIGNING_INFO.txt | cut -d= -f2- | xargs)}"
          K_ALIAS="${KEY_ALIAS:-$(grep -m1 'KEY_ALIAS ' signing/SIGNING_INFO.txt | cut -d= -f2- | xargs)}"
          K_PASS="${KEY_PASSWORD:-$(grep -m1 'KEY_PASSWORD ' signing/SIGNING_INFO.txt | cut -d= -f2- | xargs)}"
          test -n "$KS_PASS"
          test -n "$K_ALIAS"
          test -n "$K_PASS"

          cd android
          chmod +x gradlew
          BUILD_OK=0
          for attempt in 1 2 3; do
            echo "Gradle release build attempt ${attempt}/3"
            if ./gradlew assembleRelease --no-daemon --max-workers=2; then
              BUILD_OK=1
              break
            fi
            if [ "${attempt}" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          test "$BUILD_OK" = "1"
          cd ..

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk BitAnime-Pro-v23.0-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KS_PATH" --ks-key-alias "$K_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$K_PASS" --out BitAnime-Pro-v23.0.apk BitAnime-Pro-v23.0-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs BitAnime-Pro-v23.0.apk
          "$BUILD_TOOLS/aapt" dump badging BitAnime-Pro-v23.0.apk > /tmp/bitanime-badging.txt
          grep -m1 "package:" /tmp/bitanime-badging.txt
          ls -lh BitAnime-Pro-v23.0.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitAnime-Pro-v23.0-Premium-Signed-APK
          path: BitAnime-Pro-v23.0.apk
          if-no-files-found: error
          retention-days: 30
